name: Daily Intel Digest

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * *"

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install google-api-python-client
          pip install google-auth-httplib2
          pip install google-auth-oauthlib
          pip install beautifulsoup4
          pip install pyyaml

      - name: Restore Gmail token
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: |
          mkdir -p credentials
          echo "$GMAIL_TOKEN_JSON" > credentials/token.json

      - name: Restore Gmail credentials
        env:
          GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
        run: |
          echo "$GMAIL_CREDENTIALS_JSON" > credentials/gmail_credentials.json

      - name: Fetch Gmail intake
        run: |
          python3 scripts/ingestion/fetch_gmail.py

      - name: Classify intake
        run: |
          python3 scripts/ingestion/classify_email.py

            - name: Build digest file
        run: |
          mkdir -p data/processed

          echo "# Daily Intelligence Digest" > data/processed/daily_digest.md
          echo "" >> data/processed/daily_digest.md
          echo "Generated: $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> data/processed/daily_digest.md
          echo "" >> data/processed/daily_digest.md

          if [ -f data/processed/intake_log.jsonl ]; then
            python3 - <<'PY'
import json
from collections import defaultdict
from pathlib import Path

log_path = Path("data/processed/intake_log.jsonl")
digest_path = Path("data/processed/daily_digest.md")

groups = defaultdict(list)

for line in log_path.read_text().splitlines():
    if not line.strip():
        continue
    item = json.loads(line)
    verticals = item.get("verticals") or ["Unclassified"]
    for vertical in verticals:
        groups[vertical].append(item)

with digest_path.open("a") as f:
    if not groups:
        f.write("No new classified items.\n")
    for vertical in sorted(groups):
        f.write(f"## {vertical}\n\n")
        for item in groups[vertical][:10]:
            item_id = item.get("id", "unknown")
            source = item.get("source", "Unknown")
            subject = item.get("subject", "(no subject)")
            priority = item.get("priority", "low")
            preview = item.get("content_preview", "").replace("\n", " ")
            f.write(f"- `{item_id}` — **{source}** — {subject} — *{priority}* — {preview[:180]}...\n")
        f.write("\n")
PY
          else
            echo "No intake log found." >> data/processed/daily_digest.md
          fi

      - name: Build digest preview
        run: |
          echo "Generated digest:"
          cat data/processed/daily_digest.md

      - name: Send digest to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "No Slack webhook configured."
            exit 0
          fi

          DIGEST="$(cat data/processed/daily_digest.md)"

          jq -n --arg text "$DIGEST" '{text: $text}' > payload.json

          curl -sf -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d @payload.json > /dev/null