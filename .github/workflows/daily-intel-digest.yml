name: AEON Daily Pipeline
run-name: "aeon-daily-pipeline"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * *"

permissions:
  contents: read

concurrency:
  group: aeon-daily-pipeline
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib beautifulsoup4 pyyaml pypdf

      - name: Restore Gmail token
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: |
          mkdir -p credentials
          if [ -n "${GMAIL_TOKEN_JSON:-}" ]; then
            printf '%s' "$GMAIL_TOKEN_JSON" > credentials/token.json
          fi

      - name: Restore Gmail credentials
        env:
          GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
        run: |
          mkdir -p credentials
          if [ -n "${GMAIL_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GMAIL_CREDENTIALS_JSON" > credentials/gmail_credentials.json
          fi

      - name: Run deterministic AEON pipeline
        run: |
          python3 scripts/pipeline/run_local_pipeline.py

      - name: Show digest preview
        run: |
          if [ -f data/processed/daily_digest.md ]; then
            echo "Generated digest:"
            cat data/processed/daily_digest.md
          else
            echo "No digest was generated."
          fi

      - name: Show Slack payload preview
        run: |
          if [ -d data/outbox/slack/daily-intel-digest ]; then
            latest_payload="$(find data/outbox/slack/daily-intel-digest -maxdepth 1 -name '*.json' -print | sort | tail -n 1)"
          else
            latest_payload=""
          fi

          if [ -n "${latest_payload:-}" ] && [ -f "$latest_payload" ]; then
            echo "Generated Slack payload:"
            cat "$latest_payload"
          else
            echo "No Slack payload was generated."
          fi

      - name: Send Slack outbox
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python3 scripts/ingestion/send_slack_outbox.py

      - name: Skip Slack delivery
        if: ${{ secrets.SLACK_WEBHOOK_URL == '' }}
        run: |
          echo "No Slack webhook configured; skipping Slack delivery."
