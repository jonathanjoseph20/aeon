name: AEON Daily Pipeline
run-name: "aeon-daily-pipeline"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * *"

permissions:
  contents: read

concurrency:
  group: aeon-daily-pipeline
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib beautifulsoup4 pyyaml pypdf

      - name: Restore Gmail token
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: |
          mkdir -p credentials
          if [ -n "${GMAIL_TOKEN_JSON:-}" ]; then
            printf '%s' "$GMAIL_TOKEN_JSON" > credentials/token.json
          fi

      - name: Restore Gmail credentials
        env:
          GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
        run: |
          mkdir -p credentials
          if [ -n "${GMAIL_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GMAIL_CREDENTIALS_JSON" > credentials/gmail_credentials.json
          fi

      - name: Run deterministic AEON pipeline
        run: |
          python3 scripts/pipeline/run_local_pipeline.py

      - name: Show digest preview
        run: |
          if [ -f data/processed/daily_digest.md ]; then
            echo "Generated digest:"
            cat data/processed/daily_digest.md
          else
            echo "No digest was generated."
          fi
