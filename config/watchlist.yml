entities:
  Venice:
    token_match: ["venice", "vvv", "diem"]
    verticals: ["AI", "Portfolio"]
    score_boost: 6

  Dolphin:
    token_match: ["dolphin", "$POD", "xPOD"]
    phrase_match: ["Dolphin AI"]
    verticals: ["AI", "Portfolio"]
    score_boost: 6

  Base:
    token_match: ["coinbase"]
    phrase_match: ["Base ecosystem", "Base chain", "Base app"]
    regex_match: ["\\bBase\\b\\s+(?:ecosystem|chain|app|mainnet|network)"]
    verticals: ["DeFi", "Portfolio"]
    score_boost: 4

  RWA:
    token_match: ["rwa", "stablecoin"]
    phrase_match: ["tokenization", "real world assets", "private credit"]
    regex_match: ["tokeni[sz]ation"]
    verticals: ["RWA"]
    score_boost: 5

  OpenRouter:
    token_match: ["openrouter", "inference"]
    phrase_match: ["model routing"]
    verticals: ["AI"]
    score_boost: 5
